projects:
  - slug: Jobbonus
    title: Jobbonus (Departement Werk, Economie, Wetenschap, Innovatie en Sociale Economie)
    description: A yearly, tax-free premium of up to €600 for employees and civil servants in Flanders with lower wages. It aims to make work financially more attractive than unemployment and to support purchasing power, with automatic payment for most workers under set income thresholds.
  - slug: Sustatool
    title: Sustatool (Departement Werk, Economie, Wetenschap, Innovatie en Sociale Economie)
    description: An application that guides users through a five-phase process—from analysis to action and reporting—across 14–15 key themes aligned with the SDGs, offering concrete initiatives and customizable KPIs for measurable impact.
  - slug: VlaamseArbeidsmigratie
    title: Vlaamse Arbeidsmigratie (Departement Werk, Economie, Wetenschap, Innovatie en Sociale Economie)
    description: An application that enabled the Flemish government to manage and accept requests from employers to hire foreign workers.
  - slug: Kwaliteitsdatabank
    title: Kwaliteitsdatabank (Departement Werk, Economie, Wetenschap, Innovatie en Sociale Economie)
    description: An open-data registry managed by the Flemish Department of Work, Economy, Innovation, and Social Economy (WEWIS), listing service providers officially recognized for meeting quality and registration standards. It ensures transparency and enables both public institutions and funding platforms
  - slug: Opleidingsverlof
    title: Opleidingsverlof (Departement Werk, Economie, Wetenschap, Innovatie en Sociale Economie)
    description: A Flemish scheme that allows employees in the private sector to take paid time off from work to follow recognized training or education. During this leave, the employee keeps their salary (up to a capped amount), while the employer can apply for reimbursement from the Flemish government, encouraging continuous learning and upskilling in the workforce.
  - slug: KwalificerendWerkplekleren
    title: Kwalificerend werkplekleren (Departement Werk, Economie, Wetenschap, Innovatie en Sociale Economie)
    description: The Premie Kwalificerend Werkplekleren is applied for digitally via the WSE-loket, where employers register recognized workplace learning trajectories per school year. After validation, they receive €600 or €1,000 per learner, with applications submitted annually before set deadlines.
  - slug: PIO
    title: Inclusief Ondernemen (Departement Werk, Economie, Wetenschap, Innovatie en Sociale Economie)
    description: A content-driven Astro site for sharing knowledge and blog posts about software testing, automation, and leadership.
  - slug: Loket
    title: Loket (Departement Werk, Economie, Wetenschap, Innovatie en Sociale Economie)
    description: The starter application for everything connected with this specific department
  - slug: Zetes
    title: Server side signing (Zetes)
    description: A server-side signing solution for secure document management, ensuring integrity and authenticity.
  - slug: mbp
    title: Mijn Burger Profiel (Digitaal Vlaanderen)
    description: A digital platform that allows citizens to access and manage their personal information and services offered by the Flemish government.
  - slug: WebPlatform
    title: Web Platform (Digitaal Vlaanderen)
    description: A platform that provides a unified framework for building and managing digital services in the public sector, enhancing user experience and accessibility.
  - slug: TestDataGenerator
    title: Test Data Generator (b.ignited)
    description: An open and free serverless tool for generating synthetic test data.
  - slug: ewings
    title: e-wings (e-commerce poc)
    description: A platform to create multiper e-commerce sites with a single codebase, allowing for easy management and deployment of multiple online stores.
  - slug: arxcus
    title: arxcus (Billing tool poc)
    description: A billing tool proof of concept for managing invoices and payments inside of the Cronos group ecosystem.
  - slug: BaloiseInsurance
    title: Baloise Insurance (Realdolmen)
    description: End-2-End testing for insurance applications.
  - slug: Argenta
    title: The mobile banking application of Argenta
    description: A user-friendly mobile app providing banking services and account management for Argenta customers.
  - slug: VEX
    title: Vente-Exclusive (Team Logistics)
    description: A logistics platform for managing and optimizing the supply chain of Vente-Exclusive's e-commerce operations.